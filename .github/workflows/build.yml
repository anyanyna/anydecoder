name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the code targets. 21 is included because enum code generation changed
        # in JDK 15 and the gate has to cope with rebuilds produced by a newer compiler than the
        # one that built the originals -- which is the normal case.
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The decompiler jars are fetched here rather than at runtime, so that a build which
      # reaches the engine tests has them. `mvn verify` bundles them into anydecoder-core's
      # resources, which is what makes a released CLI self-contained.
      - name: Build and test
        run: mvn -B verify

      - name: Check the CLI runs
        run: |
          java -jar anydecoder-cli/target/anydecoder.jar --version
          java -jar anydecoder-cli/target/anydecoder.jar run --help
          java -jar anydecoder-cli/target/anydecoder.jar gate --help
          java -jar anydecoder-cli/target/anydecoder.jar difftest --help

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
